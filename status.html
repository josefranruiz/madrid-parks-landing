<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de los parques de Madrid</title>
    <meta name="description" content="Estado en tiempo real de los parques de Madrid: abierto o cerrado, avisos y cierres del Ayuntamiento.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --background: #F2F2F7;
            --surface: #FFFFFF;
            --card: #FFFFFF;
            --primaryText: #000000;
            --secondaryText: #8E8E93;
            --tint: #007AFF;
            --statusNormal: #34C759;
            --statusWarning: #FFD700;
            --statusMajor: #FF9500;
            --statusAlert: #FF3B30;
            --statusClosed: #8E8E93;
            --border: #C6C6C8;
            --shadow: rgba(0, 0, 0, 0.1);
            --warningBackground: #FFF3CD;
            --warningText: #856404;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #000000;
                --surface: #1C1C1E;
                --card: #2C2C2E;
                --primaryText: #FFFFFF;
                --secondaryText: #8E8E93;
                --tint: #0A84FF;
                --statusNormal: #30D158;
                --statusWarning: #FFD700;
                --statusMajor: #FF9F0A;
                --statusAlert: #FF453A;
                --statusClosed: #8E8E93;
                --border: #38383A;
                --shadow: rgba(0, 0, 0, 0.3);
                --warningBackground: #2C2C2E;
                --warningText: #FFD700;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: var(--primaryText);
            background: var(--background);
            min-height: 100vh;
        }

        .container { max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }

        .head-row {
            display: flex; align-items: flex-start;
            justify-content: space-between; gap: 16px;
        }
        .language-selector select {
            background: var(--card); color: var(--primaryText);
            border: 1px solid var(--border); border-radius: 10px;
            padding: 8px 12px; font-size: 0.85rem; cursor: pointer; flex: none;
        }

        header {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 20px; padding: 32px 28px; margin-bottom: 20px;
            box-shadow: 0 4px 20px var(--shadow);
        }
        h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
        .subtitle { color: var(--secondaryText); font-size: 0.95rem; }

        .toolbar {
            display: flex; align-items: center; gap: 12px;
            flex-wrap: wrap; margin-top: 20px;
        }
        button {
            font: inherit; font-size: 0.9rem; font-weight: 500;
            color: var(--primaryText); background: var(--card);
            border: 1px solid var(--border); border-radius: 10px;
            padding: 9px 16px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px;
            transition: border-color .15s, opacity .15s;
        }
        button:hover:not(:disabled) { border-color: var(--secondaryText); }
        button:disabled { opacity: .5; cursor: default; }
        .spinner {
            width: 12px; height: 12px; border: 2px solid currentColor;
            border-right-color: transparent; border-radius: 50%; display: none;
        }
        body.loading .spinner { display: inline-block; animation: spin .7s linear infinite; }
        body.loading .arrow { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .summary { color: var(--secondaryText); font-size: 0.9rem; }
        .summary .stale { color: var(--statusMajor); }

        .banner {
            display: none; background: var(--warningBackground); color: var(--warningText);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 12px 16px; font-size: 0.9rem; margin-bottom: 16px;
        }
        .banner.visible { display: block; }

        .park {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 18px 20px; margin-bottom: 12px;
            box-shadow: 0 2px 10px var(--shadow);
        }
        .park-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 14px; flex-wrap: wrap;
        }
        .park h2 { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.2px; }
        .badges { display: flex; align-items: center; gap: 8px; flex: none; }
        .badge {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.4px;
            padding: 5px 12px; border-radius: 20px; color: #fff; white-space: nowrap;
        }
        .badge.alert-code { font-weight: 600; }
        .status-line { color: var(--secondaryText); font-size: 0.92rem; margin-top: 6px; }

        .incident {
            background: var(--warningBackground); border-left: 4px solid var(--border);
            border-radius: 8px; padding: 12px 14px; margin-top: 14px;
        }
        .incident h3 {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.4px;
            text-transform: uppercase; color: var(--warningText); margin-bottom: 6px;
        }
        .incident p { font-size: 0.88rem; color: var(--warningText); margin-bottom: 2px; }
        .incident .label { font-weight: 600; }

        .placeholder { color: var(--secondaryText); text-align: center; padding: 50px 20px; }

        footer {
            text-align: center; color: var(--secondaryText); font-size: 0.85rem;
            padding: 28px 0 0; line-height: 1.9;
        }
        footer a { color: var(--tint); text-decoration: none; }
        footer a:hover { text-decoration: underline; }

        @media (max-width: 560px) {
            .container { padding: 20px 16px 48px; }
            .head-row { flex-direction: column; gap: 12px; }
            header { padding: 26px 20px; }
            h1 { font-size: 1.6rem; }
            .park-head { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="head-row">
                <div>
                    <h1 data-key="title">Parques de Madrid</h1>
                    <p class="subtitle" data-key="subtitle">Estado en tiempo real, según el parte de alertas del Ayuntamiento.</p>
                </div>
                <div class="language-selector">
                    <select id="languageSelect" onchange="changeLanguage(this.value)" aria-label="Idioma / Language">
                        <option value="es">🇪🇸 Español</option>
                        <option value="en">🇺🇸 English</option>
                    </select>
                </div>
            </div>
            <div class="toolbar">
                <button id="refresh" type="button">
                    <span class="spinner" aria-hidden="true"></span>
                    <span class="arrow" aria-hidden="true">↻</span>
                    <span data-key="refresh">Actualizar</span>
                </button>
                <span class="summary" id="summary" data-key="loading">Consultando al Ayuntamiento…</span>
            </div>
        </header>

        <div class="banner" id="banner" role="status"></div>

        <main id="list" aria-live="polite">
            <p class="placeholder" data-key="loading">Consultando al Ayuntamiento…</p>
        </main>

        <footer>
            <span data-key="source">Datos del parte de alertas del Ayuntamiento de Madrid.</span><br>
            <a href="index.html" data-key="home">Inicio</a> ·
            <a href="https://apps.apple.com/us/app/madrid-parks/id6748036225" data-key="app">La app para iPhone</a> ·
            <a href="privacy.html" data-key="privacy">Política de privacidad</a>
        </footer>
    </div>

<script>
(() => {
    'use strict';

    const API = 'https://sigma.madrid.es/hosted/rest/services/MEDIO_AMBIENTE/ALERTAS_PARQUES/MapServer/0/query'
        + '?f=json&where=1%3D1&outFields=*&returnGeometry=false';

    // Mismo mapa que usa la app (STATUS_MAPPING en src/utils/themes.ts).
    // `open` contesta la única pregunta que importa: ¿puedo entrar?
    // `rank` ordena por gravedad, lo más grave arriba.
    const STATES = {
        0: { key: 'closed',  open: false, color: 'var(--statusClosed)',  rank: 2 },
        1: { key: 'normal',  open: true,  color: 'var(--statusNormal)',  rank: 5 },
        2: { key: 'unknown', open: null,  color: 'var(--statusClosed)',  rank: 4 },
        3: { key: 'warning', open: true,  color: 'var(--statusWarning)', rank: 3 },
        4: { key: 'major',   open: true,  color: 'var(--statusMajor)',   rank: 1 },
        5: { key: 'alert',   open: false, color: 'var(--statusAlert)',   rank: 0 },
        6: { key: 'closed',  open: false, color: 'var(--statusClosed)',  rank: 2 }
    };
    const UNKNOWN = STATES[2];

    // Solo se muestra la pastilla del código cuando añade algo: con 0 y 6 diría
    // "Cerrado" al lado de una insignia que ya lo dice, y con 1 no hay nada que
    // contar. Es la misma regla que la app.
    const CODE_BADGE = { 2: 'unknown', 3: 'warning', 4: 'major', 5: 'alert' };

    const T = {
        es: {
            title: 'Parques de Madrid',
            subtitle: 'Estado en tiempo real, según el parte de alertas del Ayuntamiento.',
            refresh: 'Actualizar', loading: 'Consultando al Ayuntamiento…',
            open: 'Abierto', closed: 'Cerrado',
            unknown: 'Estado desconocido', warning: 'Aviso',
            major: 'Incidencia', alert: 'Alerta',
            incident: 'Información de la incidencia',
            schedule: 'Horario', date: 'Fecha', notes: 'Observaciones',
            closedByCity: 'Cerrado por el Ayuntamiento',
            source: 'Datos del parte de alertas del Ayuntamiento de Madrid.',
            home: 'Inicio', app: 'La app para iPhone', privacy: 'Política de privacidad',
            justNow: 'hace un momento', oneMin: 'hace 1 minuto',
            mins: n => `hace ${n} minutos`, oneHour: 'hace 1 hora', hours: n => `hace ${n} horas`,
            openCount: n => `${n} ${n === 1 ? 'abierto' : 'abiertos'}`,
            closedCount: n => `${n} ${n === 1 ? 'cerrado' : 'cerrados'}`,
            failed: 'No se ha podido consultar al Ayuntamiento. Inténtalo de nuevo en un momento.'
        },
        en: {
            title: 'Madrid parks',
            subtitle: 'Live status, from the city council alert feed.',
            refresh: 'Refresh', loading: 'Asking the city council…',
            open: 'Open', closed: 'Closed',
            unknown: 'Status unknown', warning: 'Warning',
            major: 'Incident', alert: 'Alert',
            incident: 'Incident information',
            schedule: 'Hours', date: 'Date', notes: 'Notes',
            closedByCity: 'Closed by the city council',
            source: 'Data from the Madrid city council alert feed.',
            home: 'Home', app: 'The iPhone app', privacy: 'Privacy policy',
            justNow: 'just now', oneMin: '1 minute ago',
            mins: n => `${n} minutes ago`, oneHour: '1 hour ago', hours: n => `${n} hours ago`,
            openCount: n => `${n} open`,
            closedCount: n => `${n} closed`,
            failed: 'Could not reach the city council. Try again in a moment.'
        }
    };

    let lang = 'es';
    let parks = null;
    let fetchedAt = null;

    const $ = sel => document.querySelector(sel);
    const esc = s => String(s ?? '').replace(/[&<>"]/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    /**
     * Limpia los textos del servicio. A veces trae horas imposibles: el
     * 12/11/2026 el Retiro venía con "00:60 a 21:00". No se corrige —no sabemos
     * si querían decir 00:00 o 06:00— pero se marca, para que no parezca un
     * error nuestro. Misma decisión que toma la app.
     */
    function clean(value) {
        if (value === null || value === undefined) return '';
        const text = String(value).trim();
        if (!text || text === 'null') return '';
        return text
            .replace(/\s+a\s+/gi, ' – ')
            .replace(/\b24:00\b/g, '00:00')
            .replace(/\b(\d{1,2}):(\d{2})\b/g,
                (orig, h, m) => (Number(h) > 23 || Number(m) > 59) ? `${orig} (sic)` : orig);
    }

    function ago(when) {
        const t = T[lang];
        const mins = Math.round((Date.now() - when) / 60000);
        if (mins < 1) return t.justNow;
        if (mins === 1) return t.oneMin;
        if (mins < 60) return t.mins(mins);
        const hrs = Math.round(mins / 60);
        return hrs === 1 ? t.oneHour : t.hours(hrs);
    }

    function render() {
        const t = T[lang];
        if (!parks) return;

        const openN = parks.filter(p => p.open === true).length;
        const closedN = parks.filter(p => p.open === false).length;
        const stale = Date.now() - fetchedAt > 20 * 60 * 1000;

        const bits = [];
        if (closedN) bits.push(`<strong>${t.closedCount(closedN)}</strong>`);
        bits.push(t.openCount(openN));
        $('#summary').innerHTML = bits.join(' · ')
            + ` · <span class="${stale ? 'stale' : ''}">${esc(ago(fetchedAt))}</span>`;

        $('#list').innerHTML = parks.slice()
            .sort((a, b) => a.rank - b.rank || a.name.localeCompare(b.name, 'es'))
            .map(p => {
                const rows = [
                    p.schedule && [t.schedule, p.schedule],
                    p.date && [t.date, p.date],
                    p.notes && [t.notes, p.notes]
                ].filter(Boolean);

                const codeKey = CODE_BADGE[p.code];
                const codeBadge = codeKey
                    ? `<span class="badge alert-code" style="background:${p.color};${p.code === 3 ? 'color:#4A3B00' : ''}">${esc(t[codeKey])}</span>`
                    : '';
                const openBadge = `<span class="badge" style="background:${p.open === false ? 'var(--statusClosed)' : 'var(--statusNormal)'}">${esc(p.open === false ? t.closed : t.open)}</span>`;

                return `<article class="park">
                    <div class="park-head">
                        <h2>${esc(p.name)}</h2>
                        <span class="badges">${codeBadge}${openBadge}</span>
                    </div>
                    ${p.open === false ? `<p class="status-line">${esc(t.closedByCity)}</p>` : ''}
                    ${rows.length ? `<div class="incident" style="border-left-color:${p.color}">
                        <h3>${esc(t.incident)}</h3>
                        ${rows.map(([k, v]) => `<p><span class="label">${esc(k)}:</span> ${esc(v)}</p>`).join('')}
                    </div>` : ''}
                </article>`;
            }).join('');
    }

    async function load() {
        document.body.classList.add('loading');
        $('#refresh').disabled = true;
        try {
            // El servicio devuelve CORS para cualquier origen y acepta GET, así
            // que esta página estática habla con él directamente desde el
            // navegador. No hay servidor intermedio que mantener.
            const res = await fetch(API, { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            if (!Array.isArray(data.features)) throw new Error('respuesta inesperada');

            parks = data.features.map(f => {
                const a = f.attributes || {};
                const code = Number.parseInt(a.ALERTA_DESCRIPCION, 10);
                const state = Number.isNaN(code) ? UNKNOWN : (STATES[code] || UNKNOWN);
                return {
                    name: String(a.ZONA_VERDE || '—').trim(),
                    code: Number.isNaN(code) ? null : code,
                    ...state,
                    date: clean(a.FECHA_INCIDENCIA),
                    // La fecha llega todos los días, haya incidencia o no, así
                    // que por sí sola no abre el recuadro: sin horario ni
                    // observaciones no hay nada que contar.
                    schedule: clean(a.HORARIO_INCIDENCIA),
                    notes: clean(a.OBSERVACIONES)
                };
            }).map(p => (!p.schedule && !p.notes) ? { ...p, date: '' } : p);

            fetchedAt = Date.now();
            $('#banner').classList.remove('visible');
            render();
        } catch (err) {
            const banner = $('#banner');
            banner.textContent = T[lang].failed;
            banner.classList.add('visible');
            if (!parks) $('#list').innerHTML = `<p class="placeholder">${esc(T[lang].failed)}</p>`;
        } finally {
            document.body.classList.remove('loading');
            $('#refresh').disabled = false;
        }
    }

    window.changeLanguage = function (next) {
        lang = T[next] ? next : 'es';
        document.documentElement.lang = lang;
        try { localStorage.setItem('parksLang', lang); } catch (e) { /* da igual */ }
        document.querySelectorAll('[data-key]').forEach(el => {
            const v = T[lang][el.getAttribute('data-key')];
            if (typeof v === 'string') el.textContent = v;
        });
        document.title = lang === 'en' ? 'Madrid parks status' : 'Estado de los parques de Madrid';
        render();
    };

    $('#refresh').addEventListener('click', () => load());

    // Al volver a la pestaña tras un rato, el dato de pantalla ya no vale.
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && fetchedAt && Date.now() - fetchedAt > 5 * 60 * 1000) load();
    });

    let stored = null;
    try { stored = localStorage.getItem('parksLang'); } catch (e) { /* da igual */ }
    changeLanguage(stored || (navigator.language || 'es').slice(0, 2));
    $('#languageSelect').value = lang;
    load();
})();
</script>
</body>
</html>
