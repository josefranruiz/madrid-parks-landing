<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estado de los parques de Madrid</title>
<meta name="description" content="¿Está abierto el Retiro ahora mismo? Estado en tiempo real de los parques de Madrid, según el parte de alertas del Ayuntamiento.">
<meta name="theme-color" content="#F7F8F5">
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#F4F6F2;
  --surface:#FFFFFF;
  --ink:#16201A;
  --ink-soft:#5E6B62;
  --ink-faint:#92A09A;
  --line:#E2E7DF;
  --line-soft:#EDF1EA;
  --accent:#1D7F4E;

  --open:#2EA55C;
  --warn:#E0A500;
  --major:#E07A1F;
  --alert:#D93B30;
  --shut:#8A958E;

  --radius:18px;
  --shadow:0 1px 2px rgba(22,32,26,.04), 0 8px 24px rgba(22,32,26,.05);
}

@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D110F;
    --surface:#161B18;
    --ink:#ECF1EC;
    --ink-soft:#9BA8A0;
    --ink-faint:#6B776F;
    --line:#252D28;
    --line-soft:#1D2420;
    --accent:#4FCB86;

    --open:#3FCB77;
    --warn:#F0C040;
    --major:#F2913C;
    --alert:#FF5A4D;
    --shut:#78847C;

    --shadow:none;
  }
}

html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  line-height:1.55;-webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1;
}

.wrap{max-width:660px;margin:0 auto;padding:clamp(20px,5vw,56px) 20px 64px}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:.95rem;letter-spacing:-.01em}
.brand .leaf{font-size:1.15rem;line-height:1}
.brand a{color:inherit;text-decoration:none}
select{
  font:inherit;font-size:.82rem;color:var(--ink-soft);
  background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:7px 10px;cursor:pointer;
}
select:hover{border-color:var(--ink-faint)}

/* ---------- titular: la respuesta ---------- */
.verdict{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:30px 30px 26px;margin-bottom:14px;position:relative;overflow:hidden;
}
.verdict::before{
  content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:var(--tone,var(--open));
}
.verdict h1{
  font-size:clamp(1.75rem,6vw,2.3rem);font-weight:700;
  letter-spacing:-.025em;line-height:1.12;margin-bottom:8px;
}
.verdict .detail{color:var(--ink-soft);font-size:1rem}
.verdict .detail b{color:var(--ink);font-weight:600}

.meta{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft);
}
.stamp{color:var(--ink-faint);font-size:.82rem}
.stamp.stale{color:var(--major)}
button{
  font:inherit;font-size:.84rem;font-weight:500;color:var(--ink-soft);
  background:transparent;border:1px solid var(--line);border-radius:999px;
  padding:7px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:border-color .15s,color .15s;margin-left:auto;
}
button:hover:not(:disabled){border-color:var(--ink-faint);color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
.spin{width:11px;height:11px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;display:none}
body.busy .spin{display:inline-block;animation:sp .6s linear infinite}
body.busy .glyph{display:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- aviso de error ---------- */
.alertbar{
  display:none;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--major);border-radius:12px;
  padding:13px 16px;font-size:.88rem;color:var(--ink-soft);margin-bottom:14px;
}
.alertbar.on{display:block}

/* ---------- lista ---------- */
.group-label{
  font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);margin:26px 0 10px 4px;
}
.park{
  background:var(--surface);border:1px solid var(--line);
  border-radius:14px;margin-bottom:8px;
  padding:16px 18px 16px 21px;position:relative;overflow:hidden;
  transition:border-color .15s;
}
.park::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tone)}
.park.calm{padding-top:13px;padding-bottom:13px}

.row{display:flex;align-items:center;gap:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tone);flex:none;
     box-shadow:0 0 0 3.5px color-mix(in srgb,var(--tone) 18%,transparent)}
.name{font-weight:600;font-size:.98rem;letter-spacing:-.012em;flex:1;min-width:0}
.state{font-size:.78rem;font-weight:600;color:var(--tone);white-space:nowrap;letter-spacing:.01em}
.state .sep{color:var(--ink-faint);font-weight:400;margin:0 5px}
.state .shutlabel{color:var(--shut)}

.note{
  margin-top:9px;padding-left:20px;font-size:.85rem;color:var(--ink-soft);
  display:flex;flex-direction:column;gap:2px;
}
.note b{font-weight:600;color:var(--ink)}

.placeholder{color:var(--ink-faint);text-align:center;padding:56px 20px;font-size:.95rem}

footer{
  margin-top:34px;padding-top:22px;border-top:1px solid var(--line-soft);
  color:var(--ink-faint);font-size:.8rem;line-height:1.9;text-align:center;
}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
footer .sep{margin:0 7px;opacity:.5}

@media (max-width:520px){
  .verdict{padding:24px 22px 22px}
  .park{padding:14px 15px 14px 18px}
  .row{gap:10px}
  .state{font-size:.74rem}
  button{margin-left:0}
  .meta{gap:10px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand"><span class="leaf">🌳</span><a href="index.html" data-k="brand">Madrid Parks</a></div>
    <select id="lang" onchange="setLang(this.value)" aria-label="Idioma / Language">
      <option value="es">Español</option>
      <option value="en">English</option>
    </select>
  </div>

  <section class="verdict" id="verdict">
    <h1 id="headline" data-k="loading">Consultando…</h1>
    <p class="detail" id="detail"></p>
    <div class="meta">
      <span class="stamp" id="stamp"></span>
      <button id="refresh" type="button">
        <span class="spin" aria-hidden="true"></span><span class="glyph" aria-hidden="true">↻</span>
        <span data-k="refresh">Actualizar</span>
      </button>
    </div>
  </section>

  <div class="alertbar" id="alertbar" role="status"></div>

  <main id="list" aria-live="polite"></main>

  <footer>
    <span data-k="source">Datos del parte de alertas del Ayuntamiento de Madrid.</span><br>
    <a href="index.html" data-k="home">Inicio</a><span class="sep">·</span>
    <a href="https://apps.apple.com/us/app/madrid-parks/id6748036225" data-k="app">App para iPhone</a><span class="sep">·</span>
    <a href="privacy.html" data-k="privacy">Privacidad</a>
  </footer>

</div>

<script>
(()=>{
'use strict';

const API='https://sigma.madrid.es/hosted/rest/services/MEDIO_AMBIENTE/ALERTAS_PARQUES/MapServer/0/query'
  +'?f=json&where=1%3D1&outFields=*&returnGeometry=false';

/* Mismo mapa que STATUS_MAPPING en la app.
   open: ¿puedo entrar?   rank: gravedad, lo peor primero. */
const S={
 0:{k:'closed', open:false, tone:'var(--shut)',  rank:2},
 1:{k:'normal', open:true,  tone:'var(--open)',  rank:5},
 2:{k:'unknown',open:null,  tone:'var(--shut)',  rank:4},
 3:{k:'warning',open:true,  tone:'var(--warn)',  rank:3},
 4:{k:'major',  open:true,  tone:'var(--major)', rank:1},
 5:{k:'alert',  open:false, tone:'var(--alert)', rank:0},
 6:{k:'closed', open:false, tone:'var(--shut)',  rank:2}
};
const UNK=S[2];
/* La pastilla del código solo cuando añade algo: con 0 y 6 repetiría
   "Cerrado", y con 1 no hay nada que contar. */
const CODE={2:'unknown',3:'warning',4:'major',5:'alert'};

const T={
 es:{brand:'Madrid Parks',refresh:'Actualizar',loading:'Consultando…',
  open:'Abierto',closed:'Cerrado',
  unknown:'Sin datos',warning:'Aviso',major:'Incidencia',alert:'Alerta',
  allClear:'Todo abierto',allClearSub:n=>`Los ${n} parques están abiertos y sin incidencias.`,
  someWarn:n=>n===1?'Un parque con aviso':`${n} parques con aviso`,
  someWarnSub:'Se puede entrar, pero el Ayuntamiento ha comunicado algo.',
  someShut:n=>n===1?'Un parque cerrado':`${n} parques cerrados`,
  shutList:names=>`Cerrado: <b>${names}</b>.`,
  schedule:'Horario',notes:'Observaciones',restricted:'Horario reducido',
  closedByCity:'Cerrado por el Ayuntamiento',
  needAttention:'Con algo que contar',fine:'Sin novedad',
  source:'Datos del parte de alertas del Ayuntamiento de Madrid.',
  home:'Inicio',app:'App para iPhone',privacy:'Privacidad',
  now:'actualizado hace un momento',min:'actualizado hace 1 minuto',
  mins:n=>`actualizado hace ${n} minutos`,hour:'actualizado hace 1 hora',hours:n=>`actualizado hace ${n} horas`,
  failed:'No se ha podido consultar al Ayuntamiento. Inténtalo de nuevo en un momento.',
  failedTitle:'Sin conexión con el Ayuntamiento'},
 en:{brand:'Madrid Parks',refresh:'Refresh',loading:'Checking…',
  open:'Open',closed:'Closed',
  unknown:'No data',warning:'Notice',major:'Incident',alert:'Alert',
  allClear:'All open',allClearSub:n=>`All ${n} parks are open, with nothing reported.`,
  someWarn:n=>n===1?'One park with a notice':`${n} parks with a notice`,
  someWarnSub:'You can go in, but the city council has reported something.',
  someShut:n=>n===1?'One park closed':`${n} parks closed`,
  shutList:names=>`Closed: <b>${names}</b>.`,
  schedule:'Hours',notes:'Notes',restricted:'Reduced hours',
  closedByCity:'Closed by the city council',
  needAttention:'Something reported',fine:'Nothing reported',
  source:'Data from the Madrid city council alert feed.',
  home:'Home',app:'iPhone app',privacy:'Privacy',
  now:'updated just now',min:'updated 1 minute ago',
  mins:n=>`updated ${n} minutes ago`,hour:'updated 1 hour ago',hours:n=>`updated ${n} hours ago`,
  failed:'Could not reach the city council. Try again in a moment.',
  failedTitle:'No answer from the city council'}
};

let lang='es', parks=null, at=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* El servicio trae horas imposibles: el 12/11/2026 el Retiro venía con
   "00:60 a 21:00". No se corrige —no sabemos si era 00:00 o 06:00— se marca. */
function clean(v){
  if(v===null||v===undefined) return '';
  const t=String(v).trim();
  if(!t||t==='null') return '';
  return t.replace(/\s+a\s+/gi,' – ').replace(/\b24:00\b/g,'00:00')
    .replace(/\b(\d{1,2}):(\d{2})\b/g,(o,h,m)=>(+h>23||+m>59)?`${o} (sic)`:o);
}

function ago(){
  const t=T[lang], m=Math.round((Date.now()-at)/6e4);
  if(m<1) return t.now; if(m===1) return t.min; if(m<60) return t.mins(m);
  const h=Math.round(m/60); return h===1?t.hour:t.hours(h);
}

function paint(){
  if(!parks) return;
  const t=T[lang];
  const shut=parks.filter(p=>p.open===false);
  const warn=parks.filter(p=>p.open!==false&&p.code!==1);

  /* El titular ES la respuesta, y el tono del borde la refuerza. */
  let head,sub,tone;
  if(shut.length){ head=t.someShut(shut.length); sub=t.shutList(shut.map(p=>esc(p.name)).join(', ')); tone='var(--alert)'; }
  else if(warn.length){ head=t.someWarn(warn.length); sub=t.someWarnSub; tone='var(--warn)'; }
  else { head=t.allClear; sub=t.allClearSub(parks.length); tone='var(--open)'; }

  $('#headline').textContent=head;
  $('#detail').innerHTML=sub;
  $('#verdict').style.setProperty('--tone',tone);
  const stale=Date.now()-at>20*6e4;
  $('#stamp').className='stamp'+(stale?' stale':'');
  $('#stamp').textContent=ago();

  /* Dos grupos: lo que pide atención arriba, lo tranquilo abajo y en silencio. */
  const busy=parks.filter(p=>p.code!==1).sort((a,b)=>a.rank-b.rank||a.name.localeCompare(b.name,'es'));
  const calm=parks.filter(p=>p.code===1).sort((a,b)=>a.name.localeCompare(b.name,'es'));

  const card=(p,quiet)=>{
    const code=CODE[p.code];
    const state=p.open===false
      ? `<span class="shutlabel">${esc(t.closed)}</span>${code?`<span class="sep">·</span>${esc(t[code])}`:''}`
      : `${esc(t.open)}${code?`<span class="sep">·</span>${esc(t[code])}`:''}`;

    /* Nada de recuadros: una línea discreta, y solo si hay algo real.
       La fecha llega todos los días aunque no pase nada, así que no cuenta. */
    const bits=[];
    if(p.schedule) bits.push(`<span><b>${esc(t.restricted)}:</b> ${esc(p.schedule)}</span>`);
    if(p.notes) bits.push(`<span>${esc(p.notes)}</span>`);
    if(p.open===false&&!bits.length) bits.push(`<span>${esc(t.closedByCity)}</span>`);

    return `<article class="park${quiet?' calm':''}" style="--tone:${p.tone}">
      <div class="row">
        <span class="dot" aria-hidden="true"></span>
        <span class="name">${esc(p.name)}</span>
        <span class="state">${state}</span>
      </div>
      ${bits.length?`<div class="note">${bits.join('')}</div>`:''}
    </article>`;
  };

  let html='';
  if(busy.length) html+=`<p class="group-label">${esc(t.needAttention)}</p>`+busy.map(p=>card(p,false)).join('');
  if(calm.length) html+=`<p class="group-label">${esc(t.fine)}</p>`+calm.map(p=>card(p,true)).join('');
  $('#list').innerHTML=html;
}

async function load(){
  document.body.classList.add('busy'); $('#refresh').disabled=true;
  try{
    /* El servicio devuelve CORS para cualquier origen y acepta GET, así que
       esta página estática habla con él directamente. Sin backend. */
    const r=await fetch(API,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!Array.isArray(d.features)) throw new Error('respuesta inesperada');

    parks=d.features.map(f=>{
      const a=f.attributes||{}, c=Number.parseInt(a.ALERTA_DESCRIPCION,10);
      const st=Number.isNaN(c)?UNK:(S[c]||UNK);
      return {name:String(a.ZONA_VERDE||'—').trim(),code:Number.isNaN(c)?null:c,...st,
              schedule:clean(a.HORARIO_INCIDENCIA),notes:clean(a.OBSERVACIONES)};
    });
    at=Date.now();
    $('#alertbar').classList.remove('on');
    paint();
  }catch(e){
    const b=$('#alertbar'); b.textContent=T[lang].failed; b.classList.add('on');
    if(!parks){ $('#headline').textContent=T[lang].failedTitle; $('#detail').textContent='';
      $('#verdict').style.setProperty('--tone','var(--major)');
      $('#list').innerHTML=`<p class="placeholder">${esc(T[lang].failed)}</p>`; }
  }finally{
    document.body.classList.remove('busy'); $('#refresh').disabled=false;
  }
}

window.setLang=function(n){
  lang=T[n]?n:'es';
  document.documentElement.lang=lang;
  try{localStorage.setItem('parksLang',lang)}catch(e){}
  document.querySelectorAll('[data-k]').forEach(el=>{
    const v=T[lang][el.getAttribute('data-k')];
    if(typeof v==='string') el.textContent=v;
  });
  document.title=lang==='en'?'Madrid parks status':'Estado de los parques de Madrid';
  paint();
};

$('#refresh').addEventListener('click',()=>load());
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&at&&Date.now()-at>5*6e4) load();
});
/* El sello "hace X minutos" envejece solo aunque no se recargue. */
setInterval(()=>{ if(at&&!document.hidden) $('#stamp').textContent=ago(); },30000);

let saved=null; try{saved=localStorage.getItem('parksLang')}catch(e){}
setLang(saved||(navigator.language||'es').slice(0,2));
$('#lang').value=lang;
load();
})();
</script>
</body>
</html>
